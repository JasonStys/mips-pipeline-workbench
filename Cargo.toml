[package]
name = "mips-pipeline-workbench"
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
authors = ["Jason Stys"]
description = "A dependency-light MIPS-like assembler, interpreter, pipeline simulator, and cache workbench"
license = "MIT"
repository = "https://github.com/JasonStys/mips-pipeline-workbench"
readme = "README.md"
keywords = ["mips", "pipeline", "assembler", "emulator", "education"]
categories = ["command-line-utilities", "simulation"]

[lib]
name = "mips_workbench"
path = "src/lib.rs"

[[bin]]
name = "mips-workbench"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

