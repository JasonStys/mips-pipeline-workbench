# File: Runs cross-platform Rust, web, repository-policy, trace, and container quality gates.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Show pinned toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run warning-free Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run Rust tests
        run: cargo test --all-targets --locked
      - name: Build optimized CLI
        run: cargo build --release --locked
      - name: Regenerate deterministic trace
        run: cargo run --locked -- pipeline examples/hazard-demo.asm web/public/demo-trace.json
      - name: Verify trace is current
        run: git diff --exit-code -- web/public/demo-trace.json

  web:
    name: TypeScript visualizer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm --prefix web ci --ignore-scripts
      - name: Audit dependencies
        run: npm --prefix web audit --audit-level=high
      - name: Compile and test
        run: npm --prefix web test
      - name: Verify production distribution
        run: npm --prefix web run smoke
      - name: Upload static evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trace-visualizer
          path: web/dist
          if-no-files-found: error
          retention-days: 14

  repository-policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify exact declaration index
        run: npm run code-index:check
      - name: Validate repository policies
        run: npm run validate
      - name: Verify generated evidence is current
        run: git diff --exit-code

  container:
    name: Container build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build non-root image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          tags: mips-pipeline-workbench:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

