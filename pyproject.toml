# File: Defines native-studio metadata and independent Python validation gates.
[project]
name = "mips-pipeline-workbench"
version = "1.1.0"
requires-python = ">=3.14.10"
description = "Owned local application for the original educational Rust ISA engines"
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
[tool.coverage.run]
source = ["mips_studio"]
branch = true
[tool.coverage.report]
show_missing = true
fail_under = 90
[tool.ruff]
target-version = "py314"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
